[package]
name = "agent-first-ui"
version = "0.6.1"
edition = "2024"
description = "Let your AI agent hand you a real interface when a step needs a person — a window opens, values can stay live in both directions, and the session ends with one typed outcome."
license = "MIT"
repository = "https://github.com/agentfirstkit/agent-first-ui"
readme = "README.md"
include = [
    "src/bin/**",
    "src/**",
    "skills/**",
    "scripts/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "clippy.toml",
]

# Tiers, because a Provider that hosts no UI session still has a frontend to
# keep honest.
#
# The featureless build is the markup guard plus frontend discovery, the trust
# gate and the per-file overlay: reading files off disk and refusing some of
# them. It costs serde, blake3, walkdir and dirs, and no server at all. That tier
# exists for the build that has a frontend but no port: a Provider whose human
# UI is itself an optional feature still has to refuse a smuggled `<script>` in
# the build where that UI is compiled out. Without this tier the only way to
# share the guard was to drag axum and tokio into a build that has neither.
#
# `page` is the same idea one step further: turning a frontend's files into a
# rendered page still costs no port and no credential, only a template engine.
# It is orthogonal to `session` rather than layered under it, so the build
# that only has to prove its templates render and check out — no server, no
# window — pays for minijinja and nothing session brings with it.
[features]
default = ["session"]
# Everything that hands a UI to a person: the session, its host, its credential,
# its security policy, the cross-process registry, the browser window, the
# `assets/` route a frontend's static files are served from, and the remote-view
# shell and proxy. This is what a Provider needs, and what the `afui` binary is
# built from — the same set a default `cargo install` and a release package
# get, so `afui session serve` is never missing from one of them.
session = [
    "cli",
    "dep:agent-first-data",
    "dep:axum",
    "dep:getrandom",
    "dep:hex",
    "dep:hyper",
    "dep:hyper-util",
    "dep:libc",
    "dep:minijinja",
    "dep:subtle",
    "dep:tempfile",
    "dep:tokio",
    "dep:tower",
    "tokio/io-util",
    "tokio/macros",
    "tokio/net",
    "tokio/process",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "tokio/sync",
    "tokio/time",
]
# Declaring the delivery flag on a command line and reading it back.
#
# Its own tier below `session` because a Provider's CLI surface does not
# change when its UI is compiled out: the same binary that can be built
# without a window still has to declare the same flags, so an agent reading
# `--help` sees one contract rather than one per build. Costs afdata's CLI
# types and nothing else — no server, no browser, no registry.
cli = ["dep:agent-first-data"]

# The template environment policy, render, rendered-markup guard, and
# element/runtime-marker contract check every Provider page goes through —
# see `src/page.rs`. Independent of `session`: assembling a page this way
# never binds a port or mints a credential.
page = ["dep:minijinja"]
# What a Provider's own tests need in order to test *through* AFUI: a frontend
# on disk and trusted, a browser that does not open, an attention policy, a
# registry to wait on, and a client for AFUI's real session runtime. Not in the
# default set and never in a release binary — a consumer adds it under
# `[dev-dependencies]`.
#
# It exists because the alternative was each consumer reimplementing AFUI's
# trust fingerprint or its WebSocket envelope. Both agree with AFUI right up
# until AFUI changes, then fail a domain test for a reason that test is not
# about.
test-support = [
    "session",
    "dep:futures-util",
    "dep:tokio-tungstenite",
]
# Cargo discovers src/bin/afui.rs without being told. The release pipeline does
# not: it reads this table to learn what a release ships, deriving the archive
# name, the Homebrew formula, and the Scoop manifest from bin.0.name, and it
# skips the packaging step entirely when the table is absent. Naming the target
# here is what makes the CLI installable rather than merely buildable.
#
# `required-features` is what lets `--no-default-features` mean the guard tier
# rather than a compile error: the CLI lists sessions and opens windows, so a
# build without them has no binary to produce.
[[bin]]
name = "afui"
path = "src/bin/afui.rs"
required-features = ["session"]

[dependencies]
# The CLI's argument parsing, event stream and skill installer. Only the binary
# uses it, and the binary is a `session` build.
agent-first-data = { version = "0.35.0", default-features = false, features = ["cli", "skill-admin"], optional = true }
# A `provider_id` and a `ui_kind` are path segments in a frontend directory
# before they are anything else, so the grammar is checked in the guard tier.
agent-first-slug = { version = "0.8.0", default-features = false }
axum = { version = "0.8", features = ["ws"], optional = true }
blake3 = "1"
dirs = "7"
getrandom = { version = "0.4", optional = true }
hex = { version = "0.4", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
# The reverse proxy speaks HTTP itself rather than through a pooling client:
# one connection per proxied request is what keeps a Server-Sent Events stream
# from sharing a connection with anything else, and `Incoming` hands the body
# back frame by frame instead of collecting it.
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
# The shell page is a template, not a Rust string, because a person has to be
# able to replace it — the same engine every Provider page in this kit uses
# rather than a second one for this crate's own page.
minijinja = { version = "3", features = ["serde"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Browser-grade parsing keeps the script guard and UiPage's structural
# contracts aligned with what a browser actually sees.  No selector API is
# needed here, and disabling the default CLI/error features keeps this in the
# featureless guard tier without pulling in a server.
scraper = { version = "0.27", default-features = false }
subtle = { version = "2", optional = true }
tempfile = { version = "3", optional = true }
# Applied directly so the credential is stripped before the Provider router
# routes, which `Router::layer` (post-routing) cannot do.
tower = { version = "0.5", optional = true }
tokio = { version = "1", optional = true }
# A Provider's integration test should drive AFUI's real runtime without
# carrying its own WebSocket framing or a private copy of the AFUI envelope.
# Kept behind `test-support`, so this client stack never reaches a release
# binary.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
walkdir = "2"

# One question std cannot ask: does the process that announced this session
# still exist? A session AFUI serves answers it with its own socket, but a
# session that only names an upstream is announced by one process and served by
# another, so `kill(pid, 0)` is what stops a crashed announcer leaving a listing
# behind. The registry is a `session` affordance, so this arrives with it.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
# `SinkExt`/`StreamExt` on a WebSocket stream. Nothing in the library polls one.
futures-util = { version = "0.3", default-features = false }
# The lifetime tests drive a real request against a served session; the library
# itself never reads or writes a socket directly. `test-util` is what lets a
# keep-alive test assert a cadence measured in minutes without waiting them.
tokio = { version = "1", features = ["io-util", "test-util"] }
# Proving the proxy streams needs a body that is deliberately not finished yet,
# which is a channel behind an Axum response.
tokio-stream = "0.1"
# A real WebSocket on both sides of the proxy. The proxy relays an upgraded
# connection without understanding it, so what has to be proven is that a real
# implementation still works through it — masking, framing and close included.
# Asserting a `101` would have tested none of that.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
