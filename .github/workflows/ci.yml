name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # The runner images ship whatever ShellCheck their distribution packages
      # — Ubuntu 24.04's is 0.9.0, two majors behind — and its rules differ from
      # the pinned one's on real code. Provision the pin so this leg judges the
      # tree by the same rules the local gate does.
      - name: Setup ShellCheck
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/install-shellcheck.sh --install

      # scripts/test.sh is written against the afdata Bash kit and reads the
      # served URL back with `afdata value`, so afdata has to exist before the
      # gate runs, not merely before the skill is validated.
      - name: Install afdata
        run: cargo install agent-first-data --locked --features skill

      - name: Validate Agent Skill
        run: afdata skill validate skills/agent-first-ui

      # Run the release gate itself rather than a hand-written command list:
      # Step 0 of a release is `projects.sh test agent-first-ui all`, which
      # execs this same script, so anything that can fail a release fails here
      # first. `all` covers fmt, both clippy profiles, the unit suites with and
      # without `serve`, the frontend and `session serve` smokes, and the
      # release smoke that proves a `--features serve` build really has serve.
      - name: Release gate
        run: ./scripts/test.sh all
