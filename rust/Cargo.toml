[package]
name = "agent-first-ui"
version = "0.2.0"
edition = "2024"
description = "A protocol that lets a tool publish **what is true** and **what can be done** as plain **data**, into a shared live **space** — so any viewer you trust, human or agent, renders the interface, and nothing the tool publishes can run on your machine. **One tool, any viewer:** the same space drives a web workbench, a terminal interface, a native app, a voice assistant, or an agent operating it directly."
license = "MIT"
repository = "https://github.com/agentfirstkit/agent-first-ui"
readme = "README.md"
# This package is intentionally data/protocol only. Repository-level protocol
# specs and fixtures live one directory up; local tests reference them there.
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "clippy.toml",
]

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
